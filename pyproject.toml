[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clearbill"
version = "0.1.0"
description = "Local medical bill vs EOB auditor powered by open models on Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.4",
  "pydantic>=2.7",
  "pypdfium2>=4.30",
  "pillow>=10",
  "typer>=0.12",
]

[project.optional-dependencies]
ui = ["streamlit>=1.38"]
heic = ["pillow-heif>=0.18"]
dev = ["pytest>=8", "reportlab>=4", "ruff>=0.6"]

[project.scripts]
clearbill = "clearbill.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/clearbill"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
